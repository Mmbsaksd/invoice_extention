<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Invoice Assistant</title>
    <style>
        /* ... existing root ... */
        :root {
            --primary: #10a37f;
            --bg: #171717;
            --card-bg: #212121;
            --text: #ececf1;
            --text-dim: #9ea2a8;
            --border: #3d3d3d;
            --hover: #2a2a2a;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            overflow: hidden;
            /* Prevent body scroll, use list scroll */
        }

        .container {
            display: flex;
            flex-direction: column;
            max-height: 560px;
            /* Chrome limit is ~600px */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        #invoice-list {
            margin-top: 12px;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 480px;
            /* Ensure space for header and footer */
            padding-right: 4px;
        }

        .title {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
        }

        .controls {
            display: flex;
            gap: 6px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            transition: all 0.2s ease;
            position: relative;
            margin-bottom: 10px;
        }

        .card:hover {
            border-color: #555;
            background: var(--hover);
        }

        .status-badge {
            font-size: 10px;
            color: #10a37f;
            background: rgba(16, 163, 127, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            position: absolute;
            top: 10px;
            right: 10px;
            font-weight: 500;
        }

        .vendor {
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 2px;
            display: block;
        }

        .details {
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .details-expandable {
            display: none;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            font-size: 11px;
        }

        .details-expandable.active {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .detail-label {
            color: #676767;
        }

        .detail-value {
            color: var(--text);
        }

        .footer-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
        }

        .btn-fill {
            background: var(--primary);
            color: white;
        }

        .btn-fill.loading {
            opacity: 0.6;
            cursor: wait;
            transform: scale(0.98);
        }

        .btn-skip {
            background: #3d3d3d;
            color: #ececf1;
        }

        .btn-upload {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 4px 8px;
        }

        .btn-refresh {
            background: transparent;
            color: var(--text-dim);
            font-size: 14px;
            padding: 0 4px;
        }

        button:hover {
            opacity: 0.8;
        }

        .toggle-btn {
            background: none;
            border: none;
            padding: 2px 0;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 11px;
            text-decoration: underline;
        }

        #status-bar {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .dot {
            width: 5px;
            height: 5px;
            background: #10a37f;
            border-radius: 50%;
        }

        .empty-state {
            text-align: center;
            padding: 40px 10px;
            color: var(--text-dim);
            font-size: 12px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #3d3d3d;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <span class="title">Invoice Assistant</span>
            <div class="controls">
                <input type="file" id="file-input" style="display: none;" multiple accept="application/pdf">
                <button class="btn-upload" id="btn-upload">Upload PDF</button>
                <button class="btn-refresh" id="btn-refresh">↻</button>
            </div>
        </div>

        <div id="invoice-list">
            <div class="empty-state">No invoices ready.<br>Upload PDFs to begin.</div>
        </div>

        <div id="status-bar">
            <span class="dot"></span>
            <span id="status-text">Standby</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
